name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The credential-free tier. Suites that need Postgres skip without
      # DATABASE_URL; the provider smoke checks are not test-*.ts files and
      # never run here.
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
